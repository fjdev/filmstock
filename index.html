<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Film Stock">
<meta name="theme-color" content="#0a1517">
<title>Film Stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  @property --p { syntax: '<percentage>'; inherits: false; initial-value: 0%; }
  :root {
    color-scheme: dark;
    --bg: #0a1517;
    --line: #2a78ff;
    --line-d: rgba(42,120,255,.42);
    --cyan: #8fe6ff;
    --cyan-d: rgba(143,230,255,.62);
    --green: #6be04f;
    --red: #ff4d36;
    --off: #10303a;
    --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: var(--bg); color: var(--cyan); font: 15px/1.3 var(--serif); -webkit-font-smoothing: antialiased; }

  .app { height: 100vh; height: 100dvh; max-width: 560px; margin: 0 auto;
         display: grid; grid-template-rows: auto minmax(0,1fr) auto auto; gap: 8px;
         padding: calc(env(safe-area-inset-top) + 6px) 10px calc(env(safe-area-inset-bottom) + 10px); }

  .box { position: relative; border: 1px solid var(--line);
         box-shadow: inset 0 0 0 3px var(--bg), inset 0 0 0 4px var(--line-d), 0 0 18px rgba(42,120,255,.14); }

  /* Cabecera compacta */
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px;
           padding: 0 2px 5px; border-bottom: 1px solid var(--line-d); }
  h1 { margin: 0; font: 400 26px/1 var(--serif); color: var(--cyan); text-shadow: 0 0 12px rgba(143,230,255,.45); }
  h1 em { color: var(--green); text-shadow: 0 0 12px rgba(107,224,79,.45); }
  .alert { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border: 1px solid var(--red);
           background: rgba(255,77,54,.1); color: var(--red); font: 8px var(--mono); letter-spacing: .2em;
           text-shadow: 0 0 6px rgba(255,77,54,.6); box-shadow: 0 0 10px rgba(255,77,54,.18); white-space: nowrap; }
  .alert b { font: 400 16px/1 var(--serif); letter-spacing: .02em; border: 1px solid rgba(255,77,54,.6); padding: 1px 5px; }

  /* Visor */
  .viewer { min-height: 0; display: flex; align-items: center; justify-content: center; padding: 18px 8px 16px;
            overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .viewer::before, .viewer::after { content: ''; position: absolute; width: 12px; height: 12px; border: 2px solid var(--cyan); opacity: .8; }
  .viewer::before { top: 4px; left: 4px; border-right: 0; border-bottom: 0; }
  .viewer::after { bottom: 4px; right: 4px; border-left: 0; border-top: 0; }
  #out { display: none; width: 100%; height: 100%; object-fit: contain; position: relative; z-index: 1; }
  .hud { position: absolute; z-index: 2; font: 8px var(--mono); letter-spacing: .2em; text-transform: uppercase;
         color: var(--cyan-d); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 58%; }
  .tl { top: 5px; left: 22px; } .tr { top: 5px; right: 22px; } .bl { bottom: 4px; left: 22px; } .br { bottom: 4px; right: 22px; }
  .hud.red { color: var(--red); text-shadow: 0 0 6px rgba(255,77,54,.6); }
  .live { animation: bl 1.4s steps(1) infinite; }
  @keyframes bl { 50% { opacity: .25; } }
  #empty { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 6px; pointer-events: none; }
  #empty svg { flex: 1; min-height: 0; width: 100%; max-width: 440px; }
  #empty p { flex: none; margin: 0; font: 9px var(--mono); letter-spacing: .28em; color: var(--cyan-d); text-transform: uppercase; }
  #empty p::after { content: '_'; animation: bl 1s steps(1) infinite; }
  .flash { position: absolute; z-index: 3; top: 24px; left: 50%; transform: translateX(-50%);
           display: flex; align-items: center; gap: 8px; padding: 4px 10px; border: 1px solid var(--red);
           background: rgba(10,21,23,.85); color: var(--red); font: 9px var(--mono); letter-spacing: .2em;
           text-transform: uppercase; text-shadow: 0 0 6px rgba(255,77,54,.6); white-space: nowrap;
           opacity: 0; transition: opacity .3s; pointer-events: none; }
  .flash b { font: 400 20px/1 var(--serif); letter-spacing: .02em; }
  .flash.show { opacity: 1; transition: none; }

  /* Botones */
  button, .btn {
    font: 400 19px/1 var(--serif); color: var(--cyan); background: rgba(42,120,255,.07);
    border: 1px solid var(--line); border-radius: 0; padding: 9px 8px; text-align: center; cursor: pointer;
    text-shadow: 0 0 6px rgba(143,230,255,.45); box-shadow: inset 0 0 10px rgba(42,120,255,.18);
  }
  button:active, .btn:active { background: rgba(143,230,255,.16); }
  button:disabled { opacity: .35; }
  input[type=file] { display: none; }
  .actions { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; }
  .actions .btn, .actions button { display: flex; align-items: center; justify-content: center; }
  .filmctl { display: grid; grid-template-columns: 34px minmax(0,1fr) 34px; }
  .filmctl .arr { font: 400 28px/1 var(--serif); padding: 0; }
  #filmBtn { flex-direction: column; gap: 3px; padding: 6px 4px; border-left: 0; border-right: 0; min-width: 0; }
  #filmBtn small { font: 8px var(--mono); letter-spacing: .14em; color: var(--red); text-transform: uppercase;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
                   text-shadow: 0 0 6px rgba(255,77,54,.5); }

  /* Panel con pestañas: Parameters / Film data */
  .tabs { padding: 16px 12px 10px; }
  .tabbar { position: absolute; top: -10px; left: 10px; display: flex; gap: 6px; z-index: 1; }
  .tab { font: 9px var(--mono); letter-spacing: .24em; text-transform: uppercase; padding: 4px 9px;
         background: var(--bg); color: var(--line); border: 1px solid var(--line-d); box-shadow: none; text-shadow: none; }
  .tab.on { background: var(--cyan); color: #061216; border-color: var(--cyan); box-shadow: 0 0 10px rgba(143,230,255,.4); }
  .panes { display: grid; }
  .pane { grid-area: 1 / 1; visibility: hidden; min-width: 0; }
  .pane.on { visibility: visible; }

  .rows { display: grid; gap: 6px; }
  .row { display: grid; grid-template-columns: 30px 70px minmax(0,1fr) 32px; align-items: center; gap: 8px;
         font: 9px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--cyan-d); transition: opacity .2s; }
  .row b { text-align: right; font: 600 11px var(--mono); letter-spacing: .05em; color: var(--cyan);
           font-variant-numeric: tabular-nums; text-shadow: 0 0 8px rgba(143,230,255,.7); }
  .bar, .row input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 14px; margin: 0; outline: none;
    background:
      linear-gradient(90deg, transparent var(--p), var(--off) var(--p)),
      linear-gradient(90deg, var(--cyan), var(--line));
    -webkit-mask: repeating-linear-gradient(90deg, #000 0 5px, transparent 5px 8px);
            mask: repeating-linear-gradient(90deg, #000 0 5px, transparent 5px 8px);
  }
  .bar { transition: --p .3s ease, opacity .2s; }
  .row input[type=range]::-webkit-slider-runnable-track { background: transparent; height: 14px; }
  .row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: transparent; }
  .row input[type=range]::-moz-range-thumb { width: 14px; height: 14px; background: transparent; border: 0; }
  .row.off .bar { opacity: .3; }
  .row.off b { opacity: .45; }
  .row.na { opacity: .3; }
  .sw { position: relative; width: 30px; height: 16px; padding: 0; border: 1px solid var(--line);
        background: transparent; box-shadow: none; }
  .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 10px;
               background: var(--line-d); transition: transform .15s; }
  .sw[aria-pressed=true] { border-color: var(--cyan); }
  .sw[aria-pressed=true]::after { transform: translateX(14px); background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  .sw:disabled { border-style: dashed; opacity: 1; }
  .stampv { font: 12px "Courier New", monospace; letter-spacing: .1em; color: #ff8a2a;
            text-shadow: 0 0 6px rgba(255,90,0,.8); text-transform: none; }
  .row.off .stampv { opacity: .3; }

  .ihead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  #iname { font: 400 22px/1 var(--serif); color: var(--cyan); text-shadow: 0 0 10px rgba(143,230,255,.45);
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { font: 8px var(--mono); letter-spacing: .14em; text-transform: uppercase; border: 1px solid var(--line);
         padding: 3px 6px; white-space: nowrap; color: var(--cyan); }
  #itier { color: var(--green); border-color: rgba(107,224,79,.6); text-shadow: 0 0 6px rgba(107,224,79,.5); }
  .meta { display: flex; gap: 5px; margin: 6px 0 5px; flex-wrap: wrap; }
  #idesc, .uses { margin: 0; line-height: 1.2; color: var(--cyan-d); overflow: hidden;
                  display: -webkit-box; -webkit-box-orient: vertical; }
  #idesc { font-size: 14px; -webkit-line-clamp: 3; }
  .uses { margin-top: 4px; font-size: 13px; -webkit-line-clamp: 2; }
  .uses em { font: normal 8px var(--mono); letter-spacing: .2em; color: var(--green); margin-right: 4px; }

  /* Lista de películas */
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; justify-content: center;
           padding: 0 10px calc(env(safe-area-inset-bottom) + 10px); pointer-events: none; }
  .sheet[hidden] { display: none; }
  .sheet-in { pointer-events: auto; width: 100%; max-width: 540px; max-height: 38dvh; overflow: auto;
              background: var(--bg); padding: 12px; }
  .sheet-h { display: flex; justify-content: space-between; align-items: center; position: sticky; top: -12px;
             background: var(--bg); padding: 4px 0 2px; z-index: 1; }
  .sheet-h span { font: 400 22px var(--serif); text-shadow: 0 0 10px rgba(143,230,255,.45); }
  .sheet-h button { font: 12px var(--mono); padding: 6px 10px; }
  .gh { display: flex; align-items: center; gap: 8px; margin: 10px 0 6px; font: 9px var(--mono);
        letter-spacing: .3em; text-transform: uppercase; color: var(--green); }
  .gh::after { content: ''; flex: 1; height: 1px; background: var(--line-d); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .grid button { display: flex; align-items: center; gap: 8px; font-size: 17px; text-align: left; padding: 8px 10px;
                 box-shadow: none; border-color: var(--line-d); min-width: 0; }
  .grid button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grid button i { font: normal 9px var(--mono); opacity: .6; }
  .grid button u { margin-left: auto; text-decoration: none; font: 10px var(--mono); opacity: .7; }
  .grid button.on { border-color: var(--red); color: var(--red); background: rgba(255,77,54,.1); text-shadow: 0 0 8px rgba(255,77,54,.6); }

  #err { position: fixed; left: 10px; right: 10px; bottom: calc(env(safe-area-inset-bottom) + 6px); z-index: 70;
         font: 10px var(--mono); color: var(--red); white-space: pre-wrap; background: rgba(20,0,0,.85); padding: 6px; }
  #err:empty { display: none; }

  @media (prefers-reduced-motion: reduce) { .live, #empty p::after { animation: none; } .bar { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Film <em>Stock</em></h1>
    <div class="alert"><b id="chan">C01</b><span id="state">NO SIGNAL</span></div>
  </header>

  <div class="viewer box" id="stage">
    <div class="hud tl" id="hudfilm">—</div>
    <div class="hud tr" id="hudres">—</div>
    <div class="hud bl">Swipe ⇆ · hold ▸ orig</div>
    <div class="hud br" id="hudstate">Stby</div>
    <div class="flash" id="flash"><b id="fch">C01</b><span id="fnm"></span></div>
    <div id="empty"></div>
    <canvas id="out"></canvas>
  </div>

  <nav class="actions">
    <div class="filmctl">
      <button id="prev" class="arr" type="button" aria-label="Película anterior">‹</button>
      <button id="filmBtn" type="button">Film ▾<small id="filmSub">—</small></button>
      <button id="next" class="arr" type="button" aria-label="Película siguiente">›</button>
    </div>
    <label class="btn" for="file">Import</label>
    <input id="file" type="file" accept="image/*">
    <button id="save" type="button" disabled>Save</button>
  </nav>

  <section class="tabs box">
    <div class="tabbar">
      <button class="tab on" type="button" data-t="params">Parameters</button>
      <button class="tab" type="button" data-t="info">Film data</button>
    </div>
    <div class="panes">
      <div class="pane on" id="p_params">
        <div class="rows">
          <div class="row"><span></span><span>Strength</span>
            <input type="range" id="strength" min="0" max="100" value="100"><b id="v_strength">100</b></div>
          <div class="row" id="r_grain"><button class="sw" data-k="grain" type="button" aria-label="Grain"></button>
            <span>Grain</span><div class="bar"></div><b></b></div>
          <div class="row" id="r_hal"><button class="sw" data-k="hal" type="button" aria-label="Halation"></button>
            <span>Halation</span><div class="bar"></div><b></b></div>
          <div class="row" id="r_vig"><button class="sw" data-k="vig" type="button" aria-label="Vignette"></button>
            <span>Vignette</span><div class="bar"></div><b></b></div>
          <div class="row" id="r_leak"><button class="sw" data-k="leak" type="button" aria-label="Light leak"></button>
            <span>Leak</span><div class="bar"></div><b></b></div>
          <div class="row" id="r_date"><button class="sw" data-k="date" type="button" aria-label="Date"></button>
            <span>Date</span><span class="stampv" id="stampv"></span><b></b></div>
        </div>
      </div>
      <div class="pane" id="p_info">
        <div class="ihead"><span id="iname">—</span><span class="tag" id="itier">—</span></div>
        <div class="meta"><span class="tag" id="iiso">—</span><span class="tag" id="itype">—</span><span class="tag" id="iproc">—</span></div>
        <p id="idesc"></p>
        <p class="uses"><em>IDEAL ▸</em><span id="iuses"></span></p>
      </div>
    </div>
  </section>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in box">
    <div class="sheet-h"><span>Select film</span><button id="close" type="button">✕</button></div>
    <div id="list"></div>
  </div>
</div>

<div id="err"></div>

<script>
const MAXTEX = 4096, PREV = 1400;
const HT0 = .92, HT1 = .99;   // umbral de luces quemadas para el halation
const BN = ['R','O','Y','G','A','B','P','M'];

// bands: [desplazamiento de matiz (grados), saturación (±), luminosidad (±)]
// grain: [cantidad, tamaño, croma (0=mono,1=color), rugosidad]   hal: [cantidad, radio, color]
// curve / curveR / curveG / curveB: puntos [entrada, salida] de 0 a 1 (si hay curve, sustituye a contrast, curveS y lift)
// midTint: tinte aditivo en medios tonos
const mk = o => Object.assign({ bw:0, mono:[.3,.59,.11], wb:[1,1,1], lift:.02, gain:[1,1,1], contrast:1, curveS:.15,
  shTint:[0,0,0], hiTint:[0,0,0], midTint:[0,0,0], sat:1, soft:.15, bands:{}, grain:[.3,1,.5,.5], hal:[0,.02,[1,.3,.1]] }, o);

const FILMS = [
 mk({ n:'Gold 200', t:'A', d:'Eje azul-dorado, rojos a naranja, verdes a amarillo, luces algo rojizas.',
  lift:[.022,.02,.015], gain:[1.03,1,.95], contrast:1.08, curveS:.2, sat:1.06, soft:.12,
  shTint:[.012,.006,-.006], hiTint:[.03,.012,-.03],
  bands:{R:[10,-.05,0],O:[4,.12,.04],Y:[-5,.10,.04],G:[-22,-.05,-.03],A:[0,-.05,0],B:[3,.06,-.03],P:[-5,-.35,0],M:[0,-.30,0]},
  grain:[.28,.9,.55,.4], hal:[.03,.015,[1,.3,.12]] }),
 mk({ n:'Portra 400', t:'A', d:'Fiel y desaturada de forma pareja, verdes a amarillo, azul algo frío, grano suave.',
  lift:[.026,.024,.026], gain:[1.02,1,.97], contrast:1, curveS:.1, sat:.86,
  shTint:[.004,0,.004], hiTint:[.014,.005,-.012],
  bands:{R:[5,-.06,.02],O:[1,-.02,0],Y:[-3,-.05,.02],G:[-12,-.08,.02],A:[0,-.10,-.02],B:[0,.04,-.06],P:[0,-.04,0],M:[2,-.04,.03]},
  grain:[.30,1.05,.45,.35] }),
 mk({ n:'Ektar 100', t:'A', d:'Azul hacia cian, rojos y dorados a naranja, púrpuras pastel, grano muy fino.',
  lift:[.008,.008,.01], gain:[1.02,1,.96], contrast:1.1, curveS:.25, sat:.97,
  hiTint:[.02,.01,-.015],
  bands:{R:[7,-.03,0],O:[6,-.02,.01],Y:[-6,-.04,0],G:[-9,-.08,.03],A:[-6,0,-.03],B:[-9,.10,-.10],P:[0,-.25,0],M:[0,-.22,0]},
  grain:[.18,.8,.4,.3] }),
 mk({ n:'Tri-X 400', t:'B', d:'B/N de contraste alto y grano grueso (pensada para empujar a 800).',
  bw:1, mono:[.34,.52,.14], lift:.03, contrast:1.2, curveS:.4, sat:0, grain:[.62,1.5,0,.9] }),
 mk({ n:'CineStill 800T', t:'A', d:'Luz día sobre película de tungsteno: verdes y azules a cian, rojos naranja saturados, halation marcado.',
  wb:[.9,1,1.13], lift:[.03,.03,.035], contrast:1.05, curveS:.18, soft:.28,
  shTint:[-.012,.006,.022], hiTint:[.015,0,-.01],
  bands:{R:[8,.15,-.04],O:[5,.12,-.02],Y:[-3,-.15,0],G:[22,-.12,-.05],A:[0,0,-.05],B:[-14,0,-.06],P:[-20,-.08,0],M:[-12,-.15,-.03]},
  grain:[.36,1.2,.65,.5], hal:[.95,.032,[1,.30,.10]] }),
 mk({ n:'HP5+', t:'B', d:'B/N equilibrada, contraste medio, grano parejo y sombras con detalle.',
  bw:1, mono:[.30,.54,.16], lift:.028, contrast:1.08, curveS:.22, sat:0, grain:[.44,1.3,0,.4] }),
 mk({ n:'Portra 160', t:'A', d:'Alta fidelidad tonal, desaturación suave, verdes entre verde y amarillo, púrpuras hacia azul.',
  lift:[.02,.02,.022], gain:[1.01,1,.98], contrast:.98, curveS:.08, sat:.88, soft:.18,
  hiTint:[.01,.004,-.008],
  bands:{R:[-2,.02,0],O:[2,-.05,0],Y:[3,-.04,0],G:[-9,-.09,.03],A:[0,-.08,-.02],B:[-3,-.03,-.05],P:[-18,-.06,.03],M:[0,-.07,0]},
  grain:[.2,.85,.4,.3] }),
 mk({ n:'Velvia 100', t:'B', d:'Diapositiva de saturación ultra alta, negros profundos, contraste duro, grano finísimo.',
  lift:0, contrast:1.18, curveS:.45, sat:1.28, soft:.05,
  bands:{R:[-2,.10,-.04],O:[0,.08,0],Y:[-3,.05,0],G:[4,.12,-.05],A:[0,.08,-.03],B:[-3,.14,-.08],P:[0,.10,0],M:[-4,.10,0]},
  grain:[.10,.7,.3,.2] }),
 mk({ n:'Fomapan 200', t:'B', d:'B/N muy granulada, sensible al rojo y poco al azul: cielos oscuros, pieles claras.',
  bw:1, mono:[.50,.40,.10], lift:.022, contrast:1.14, curveS:.38, sat:0, soft:.22, grain:[.58,1.45,0,1] }),
 mk({ n:'Fujifilm C200', t:'C', d:'Aproximación: Fuji natural, algo menos cálida que Kodak. Sin fuente directa.',
  lift:[.022,.022,.024], gain:[.995,1,1], contrast:1.06, curveS:.15, hiTint:[.006,.003,-.006],
  bands:{R:[3,-.04,0],Y:[-2,-.05,0],G:[6,0,-.03],B:[0,.04,-.03]}, grain:[.30,1,.5,.4] }),
 mk({ n:'Lomography 800', t:'C', d:'Aproximación a partir de la Color 400: saturada, verdes amarillos, contraste fuerte y grano visible.',
  lift:.02, gain:[1.04,1,.94], contrast:1.12, curveS:.3, sat:1.12, soft:.22, hiTint:[.025,.01,-.025],
  bands:{R:[12,-.04,0],O:[5,.04,0],Y:[-4,-.10,0],G:[-26,-.05,0],B:[-6,.02,-.03],P:[-8,-.10,0],M:[8,-.15,0]},
  grain:[.52,1.35,.65,.6] }),
 mk({ n:'Portra 800', t:'B', d:'Como la 400 pero más cálida, con más contraste, saturación y grano.',
  lift:[.028,.026,.028], gain:[1.03,1,.95], contrast:1.06, curveS:.15, sat:.96, hiTint:[.022,.008,-.02],
  bands:{R:[5,-.02,.02],O:[2,0,0],Y:[-3,-.02,.02],G:[-10,-.05,.02],A:[0,-.07,-.02],B:[0,.03,-.05],P:[0,-.02,0],M:[2,-.03,.03]},
  grain:[.42,1.2,.5,.5] }),
 mk({ n:'Superia 400', t:'B', d:'Fuji limpia: verdes fríos y densos, rosas vivos, contraste algo mayor que Kodak.',

// ---------- Curvas tonales (spline monótona) ----------
function curveLUT(pts){
  const n = pts.length, h = [], d = [], m = [];
  for(let i = 0; i < n-1; i++){ h[i] = pts[i+1][0]-pts[i][0]; d[i] = (pts[i+1][1]-pts[i][1])/h[i]; }
  m[0] = d[0]; m[n-1] = d[n-2];
  for(let i = 1; i < n-1; i++) m[i] = d[i-1]*d[i] <= 0 ? 0 : (d[i-1]+d[i])/2;
  for(let i = 0; i < n-1; i++){
    if(d[i] === 0){ m[i] = 0; m[i+1] = 0; }
    else {
      const a = m[i]/d[i], b = m[i+1]/d[i], s = a*a + b*b;
      if(s > 9){ const t = 3/Math.sqrt(s); m[i] = t*a*d[i]; m[i+1] = t*b*d[i]; }
    }
  }
  const out = new Float32Array(256);
  for(let k = 0; k < 256; k++){
    const x = k/255; let y;
    if(x <= pts[0][0]) y = pts[0][1];
    else if(x >= pts[n-1][0]) y = pts[n-1][1];
    else {
      let i = 0; while(i < n-2 && x >= pts[i+1][0]) i++;
      const t = (x-pts[i][0])/h[i], t2 = t*t, t3 = t2*t;
      y = (2*t3-3*t2+1)*pts[i][1] + (t3-2*t2+t)*h[i]*m[i] + (-2*t3+3*t2)*pts[i+1][1] + (t3-t2)*h[i]*m[i+1];
    }
    out[k] = y < 0 ? 0 : y > 1 ? 1 : y;
  }
  return out;
}
function buildLut(f){
  const M = curveLUT(f.curve);
  const R = f.curveR ? curveLUT(f.curveR) : null, G = f.curveG ? curveLUT(f.curveG) : null, B = f.curveB ? curveLUT(f.curveB) : null;
  const px = new Uint8Array(256*4);
  for(let k = 0; k < 256; k++){
    const v = M[k], idx = Math.round(v*255);
    px[k*4]   = Math.round((R ? R[idx] : v)*255);
    px[k*4+1] = Math.round((G ? G[idx] : v)*255);
    px[k*4+2] = Math.round((B ? B[idx] : v)*255);
    px[k*4+3] = 255;
  }
  return px;
}

const VS = `#version 300 es
in vec2 p; out vec2 uv;
void main(){ uv = p*.5+.5; gl_Position = vec4(p,0.,1.); }`;

const FS = `#version 300 es
precision highp float; precision highp int;
in vec2 uv; out vec4 o;
uniform sampler2D tex; uniform vec2 res; uniform float seed;
uniform sampler2D htex;
uniform sampler2D lut; uniform float useLut;
uniform vec3 wb, lift, gain, shTint, hiTint, midTint, mono, halCol;
uniform float bw, contrast, sCurve, sat, soft;
uniform vec3 bands[8];
uniform float grainAmt, grainSize, grainChroma, grainRough, halAmt, halRad, strength, vignette, leak;

const float CEN[8] = float[8](0.,30.,60.,120.,180.,240.,275.,315.);
const float WID[8] = float[8](45.,30.,60.,60.,60.,60.,40.,45.);

vec3 toLin(vec3 c){ return pow(c, vec3(2.2)); }
vec3 toGam(vec3 c){ return pow(max(c, vec3(0.)), vec3(1./2.2)); }
float luma(vec3 c){ return dot(c, vec3(.2126,.7152,.0722)); }

vec3 lutA(vec3 c){
  vec3 t = clamp(c, 0., 1.)*(255./256.) + .5/256.;
  return vec3(texture(lut, vec2(t.r, .5)).r, texture(lut, vec2(t.g, .5)).g, texture(lut, vec2(t.b, .5)).b);
}

vec3 rgb2hsv(vec3 c){
  vec4 K = vec4(0., -1./3., 2./3., -1.);
  vec4 p = mix(vec4(c.bg, K.wz), vec4(c.gb, K.xy), step(c.b, c.g));
  vec4 q = mix(vec4(p.xyw, c.r), vec4(c.r, p.yzx), step(p.x, c.r));
  float d = q.x - min(q.w, q.y); float e = 1e-10;
  return vec3(abs(q.z + (q.w - q.y)/(6.*d + e)), d/(q.x + e), q.x);
}
vec3 hsv2rgb(vec3 c){
  vec4 K = vec4(1., 2./3., 1./3., 3.);
  vec3 p = abs(fract(c.xxx + K.xyz)*6. - K.www);
  return c.z * mix(K.xxx, clamp(p - K.xxx, 0., 1.), c.y);
}

uint pcg(uint v){ uint s = v*747796405u + 2891336453u; uint w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u; return (w >> 22u) ^ w; }
float rnd(ivec2 i, uint s){ uint h = pcg(uint(i.x) + pcg(uint(i.y) + pcg(s + uint(seed))));
  return float(h) * (1.0/4294967295.0); }
float vnoise(vec2 p, uint s){
  vec2 i = floor(p); vec2 f = fract(p); f = f*f*(3.-2.*f); ivec2 ii = ivec2(i);
  float a = rnd(ii,s), b = rnd(ii+ivec2(1,0),s), c = rnd(ii+ivec2(0,1),s), d = rnd(ii+ivec2(1,1),s);
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
}
float gnoise(vec2 p, uint s){
  float a = vnoise(p, s), b = vnoise(p*2.1 + 7.3, s + 13u);
  float k = 0.4*grainRough;
  return (a*(1.-k) + b*k - .5) * 2.6;
}

void main(){
  vec3 src = texture(tex, uv).rgb;
  vec3 base = mix(src, textureLod(tex, uv, 1.0).rgb, soft);
  vec3 lin = toLin(base) * wb;

  if(halAmt > .001){
    vec2 hsz = vec2(textureSize(htex, 0));
    float lod = clamp(log2(halRad * max(hsz.x, hsz.y) * .35), 1., 8.);
    vec3 acc = vec3(0.);
    for(int i = 0; i < 12; i++){
      float a = float(i) * 2.39996;
      float r = halRad * sqrt((float(i) + .5)/12.);
      vec2 off = vec2(cos(a), sin(a) * res.x/res.y) * r;
      acc += toLin(textureLod(htex, uv + off, lod).rgb);
    }
    float hl = luma(acc/12.);
    lin += vec3(hl) * halCol * halAmt * 4.;
  }

  vec3 c = toGam(lin);
  if(bw > .5) c = vec3(dot(c, mono));

  if(useLut > .5){
    c = lutA(c);
  } else {
    c = clamp((c - .5)*contrast + .5, 0., 1.);
    c = mix(c, c*c*(3. - 2.*c), sCurve);
  }
  float l = luma(c);
  c += shTint*pow(1.-l, 2.) + hiTint*l*l + midTint*4.*l*(1.-l);
  c *= gain;
  if(useLut < .5) c = lift + c*(1. - lift);

  vec3 hsv = rgb2hsv(clamp(c, 0., 1.));
  float hd = hsv.x*360.;
  float hs = 0., ss = 0., ls = 0., ws = 0.;
  for(int i = 0; i < 8; i++){
    float d = abs(mod(hd - CEN[i] + 180., 360.) - 180.);
    float w = max(0., 1. - d/WID[i]); w = w*w*(3. - 2.*w);
    ws += w; hs += w*bands[i].x; ss += w*bands[i].y; ls += w*bands[i].z;
  }
  ws = max(ws, 1.); hs /= ws; ss /= ws; ls /= ws;
  float m = smoothstep(.02, .2, hsv.y);
  hsv.x = fract(hsv.x + hs*m/360.);
  hsv.y = clamp(hsv.y*(1. + ss*m), 0., 1.);
  hsv.z = clamp(hsv.z*(1. + ls*m), 0., 1.);
  c = hsv2rgb(hsv);
  float l2 = luma(c);
  c = mix(vec3(l2), c, sat);

  c = mix(src, c, strength);

  float cell = max(1., grainSize * max(res.x, res.y)/1800.);
  vec2 gp = gl_FragCoord.xy / cell;
  float n0 = gnoise(gp, 0u), n1 = gnoise(gp, 101u), n2 = gnoise(gp, 202u);
  vec3 n = mix(vec3(n0), vec3(n0, n1, n2), grainChroma);
  float L = luma(c);
  float lw = .3 + .7*4.*L*(1. - L);
  c += n * grainAmt * lw * .16;

  vec2 q = uv - .5; q.x *= res.x/res.y;
  c *= 1. - vignette*smoothstep(.3, .9, length(q));

  float side = step(.5, fract(seed*.37));
  float x = mix(uv.x, 1. - uv.x, side);
  float lk = pow(smoothstep(.35, 0., x), 2.) * (.7 + .3*sin(uv.y*4. + seed));
  c += vec3(1., .45, .18) * lk * leak * .5;

  o = vec4(clamp(c, 0., 1.), 1.);
}`;

const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const U = {};
['htex','lut','useLut','midTint','tex','res','seed','wb','lift','gain','shTint','hiTint','mono','halCol','bw','contrast','sCurve','sat','soft','bands',

 .forEach(n => U[n] = gl.getUniformLocation(prog, n));

const lutTex = gl.createTexture();
gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, lutTex);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 256, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(256*4));
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.activeTexture(gl.TEXTURE0);
function uploadLut(f){
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, lutTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 256, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, buildLut(f));
  gl.activeTexture(gl.TEXTURE0);
}

function buildHalo(src){
  const k = Math.min(1, 1024/Math.max(src.width, src.height));
  const w = Math.max(1, Math.round(src.width*k)), h = Math.max(1, Math.round(src.height*k));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d', { willReadFrequently:true });
  x.drawImage(src, 0, 0, w, h);
  const id = x.getImageData(0, 0, w, h), d = id.data;
  for(let i = 0; i < d.length; i += 4){
    const m = Math.max(d[i], d[i+1], d[i+2]) / 255;
    let t = (m - HT0) / (HT1 - HT0); t = t < 0 ? 0 : t > 1 ? 1 : t; t = t*t*(3 - 2*t);
    d[i] *= t; d[i+1] *= t; d[i+2] *= t; d[i+3] = 255;
  }
  x.putImageData(id, 0, 0);
  return c;
}

// ---------- Estado ----------
let cur = FILMS[0], ci = 0, seed = Math.floor(Math.random()*1e6);

const pad = n => String(n).padStart(2, '0');

const bandsArr = o => { const a = new Float32Array(24); for(const k in o) a.set(o[k], BN.indexOf(k)*3); return a; };
const TIER = { A:'●', B:'◐', C:'○' };
const TSHORT = { A:'Measured', B:'Reference', C:'Provisional' };

// Interruptores on/off. Los niveles son los de cada película y no se regulan.
const ON = { grain:true, hal:true, vig:true, leak:false, date:false };

  grain: f => ({ ok:true,           p: Math.min(1, gsz(f)/1.3) }),

function draw(w, h){
  glc.width = w; glc.height = h; gl.viewport(0, 0, w, h);

  gl.uniform1f(U.useLut, p.curve ? 1 : 0); gl.uniform3fv(U.midTint, p.midTint);
  gl.uniform2f(U.res, w, h); gl.uniform1f(U.seed, seed);
  gl.uniform3fv(U.wb, p.wb); gl.uniform3fv(U.lift, v3(p.lift)); gl.uniform3fv(U.gain, p.gain);
  gl.uniform3fv(U.shTint, p.shTint); gl.uniform3fv(U.hiTint, p.hiTint); gl.uniform3fv(U.mono, p.mono);
  gl.uniform3fv(U.halCol, p.hal[2]);
  gl.uniform1f(U.bw, p.bw); gl.uniform1f(U.contrast, p.contrast); gl.uniform1f(U.sCurve, p.curveS);
  gl.uniform1f(U.sat, p.sat); gl.uniform1f(U.soft, p.soft);
  gl.uniform3fv(U.bands, bandsArr(p.bands));
  gl.uniform1f(U.grainAmt, on('grain') ? p.grain[0]*s : 0);
  gl.uniform1f(U.grainSize, p.grain[1]);
  gl.uniform1f(U.grainChroma, p.grain[2]); gl.uniform1f(U.grainRough, p.grain[3]);
  gl.uniform1f(U.halAmt, on('hal') ? p.hal[0] : 0); gl.uniform1f(U.halRad, p.hal[1]);
  gl.uniform1f(U.strength, s);
  gl.uniform1f(U.vignette, on('vig') ? p.vig*s : 0);
  gl.uniform1f(U.leak, on('leak') ? p.leak*s : 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// ---------- Laboratorio (pantalla sin foto) ----------
// Curva característica de la película: sus curvas y tintes reales, con las diferencias entre canales exageradas ×4.
function toneCurves(f){
  const N = 40, ch = [[], [], []], lf = v3(f.lift);
  const M = f.curve ? curveLUT(f.curve) : null;
  const C = [f.curveR, f.curveG, f.curveB].map(c => c ? curveLUT(c) : null);
  for(let i = 0; i <= N; i++){
    const x = i/N; let ys;
    if(M){ const v = M[Math.round(x*255)]; ys = C.map(c => c ? c[Math.round(v*255)] : v); }
    else { let y = Math.min(1, Math.max(0, (x-.5)*f.contrast + .5)); y += (y*y*(3-2*y) - y)*f.curveS; ys = [y, y, y]; }
    const l = (ys[0] + ys[1] + ys[2])/3;
    ys = ys.map((y, c) => (y + f.shTint[c]*(1-l)*(1-l) + f.hiTint[c]*l*l + f.midTint[c]*4*l*(1-l)) * f.gain[c] * f.wb[c]);
    if(!M) ys = ys.map((y, c) => lf[c] + y*(1 - lf[c]));
    const a = (ys[0] + ys[1] + ys[2])/3;
    ys.forEach((y, c) => ch[c].push(a + (y - a)*4));
  }
  return ch;
}

function labSVG(f){
  const ch = toneCurves(f), X0 = 34, X1 = 282, Y0 = 318, Y1 = 218;
  const P = a => a.map((y, i) => `${i ? 'L' : 'M'}${(X0 + (X1-X0)*i/(a.length-1)).toFixed(1)} ${(Y0 - (Y0-Y1)*Math.min(1, Math.max(0, y))).toFixed(1)}`).join(' ');
  const curves = f.bw
    ? `<path d="${P(ch[1])}" stroke="#e9f7ff" stroke-width="1.4" fill="none"/>`
    : ['#ff4d36','#6be04f','#8fe6ff'].map((c, i) => `<path d="${P(ch[i])}" stroke="${c}" stroke-width="1.2" fill="none" opacity=".9"/>`).join('');
  let grid = '';
  for(let i = 1; i < 5; i++){ const x = X0 + (X1-X0)*i/5; grid += `<line x1="${x}" y1="${Y1}" x2="${x}" y2="${Y0}"/>`; }
  for(let j = 1; j < 4; j++){ const y = Y0 - (Y0-Y1)*j/4; grid += `<line x1="${X0}" y1="${y}" x2="${X1}" y2="${y}"/>`; }
  const gs = gsz(f), ra = 1.6 + gs*2.2, rb = ra*1.7;
  let lat = '', bonds = '';
  for(let i = 0; i < 5; i++) bonds += `<line x1="${172+i*24}" y1="76" x2="${172+i*24}" y2="142"/>`;
  for(let j = 0; j < 4; j++) bonds += `<line x1="172" y1="${76+j*22}" x2="268" y2="${76+j*22}"/>`;
  for(let i = 0; i < 5; i++) for(let j = 0; j < 4; j++){
    const x = 172 + i*24, y = 76 + j*22;
    lat += (i + j) % 2
      ? `<circle cx="${x}" cy="${y}" r="${ra.toFixed(1)}" fill="#8fe6ff"/>`
      : `<circle cx="${x}" cy="${y}" r="${rb.toFixed(1)}" fill="#0a1517" stroke="#2a78ff"/>`;
  }
  const um = (0.25 + gs*0.9).toFixed(2), SERIF = "'Instrument Serif', Georgia, serif";
  return `<svg viewBox="0 0 300 372" aria-hidden="true" font-family="ui-monospace, Menlo, monospace">
  <rect x="10" y="8" width="280" height="20" fill="rgba(255,77,54,.1)" stroke="#ff4d36"/>

  <text x="282" y="22" fill="#ff4d36" font-size="8" letter-spacing="1.5" text-anchor="end">C${pad(ci+1)} · ISO ${f.iso}<animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></text>
  <g fill="none" stroke="#2a78ff" stroke-width=".8">
    <rect x="10" y="38" width="135" height="148"/><rect x="155" y="38" width="135" height="148"/><rect x="10" y="196" width="280" height="136"/>
  </g>
  <g font-size="7.5" fill="rgba(143,230,255,.75)" letter-spacing="1">
    <text x="18" y="51">DEVELOPER · CD-4</text>
    <text x="163" y="51">SILVER HALIDE · AgBr</text>
    <text x="18" y="179">C₁₂H₂₀N₂O · e⁻ DONOR</text>
    <text x="163" y="179">CRYSTAL ⌀ ${um} µm</text>
    <text x="18" y="209">D-LOG H · ${L(f).toUpperCase()}</text>
    <text x="${X1}" y="328" text-anchor="end">LOG H</text>
    <text x="20" y="${Y1+4}">D</text>
  </g>
  <g stroke="#6be04f" fill="none" stroke-width="1.1">
    <polygon points="77,89 99.5,102 99.5,128 77,141 54.5,128 54.5,102"/>
    <circle cx="77" cy="115" r="14"/>
    <path d="M77 89V77 M99.5 102L112 95 M77 141V152"/>
    <circle cx="77" cy="115" r="38" stroke-dasharray="2 4" opacity=".4"/>
  </g>
  <g fill="#6be04f" font-size="10" font-family="${SERIF}">
    <text x="77" y="73" text-anchor="middle">NH₂</text>
    <text x="114" y="95">CH₃</text>
    <text x="77" y="163" text-anchor="middle">N(C₂H₅)C₂H₄OH</text>
  </g>
  <circle r="2.2" fill="#8fe6ff"><animateMotion dur="4s" repeatCount="indefinite" path="M115,115 A38,38 0 1,1 39,115 A38,38 0 1,1 115,115"/></circle>
  <g stroke="rgba(42,120,255,.35)" stroke-width=".6">${bonds}</g>
  ${lat}
  <g stroke="#ff4d36" fill="none" stroke-width="1">
    <path d="M278 42 q-3 3 0 6 t0 6 t0 6 t0 6"/>
    <animate attributeName="opacity" values="1;.2;1" dur="1.1s" repeatCount="indefinite"/>
  </g>
  <text x="272" y="58" text-anchor="end" fill="#ff4d36" font-size="11" font-style="italic" font-family="${SERIF}">hν</text>
  <g stroke="rgba(42,120,255,.3)" stroke-width=".6" stroke-dasharray="1 3">${grid}</g>
  <path d="M${X0} ${Y1} V${Y0} H${X1}" stroke="#2a78ff" fill="none"/>
  ${curves}
  <line x1="${X0}" x2="${X0}" y1="${Y1}" y2="${Y0}" stroke="#ff4d36" stroke-width=".8" opacity=".8">
    <animate attributeName="x1" from="${X0}" to="${X1}" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="x2" from="${X0}" to="${X1}" dur="3.2s" repeatCount="indefinite"/>
  </line>
  <text x="150" y="353" text-anchor="middle" fill="#8fe6ff" font-size="17" font-style="italic" font-family="${SERIF}">2AgBr + hν → 2Ag⁰ + Br₂</text>
  <text x="150" y="368" text-anchor="middle" fill="rgba(143,230,255,.6)" font-size="7.5" letter-spacing="1.5">PROCESS ${f.proc}</text>
</svg>`;
}
const syncLab = () => { if(!ready) $('empty').innerHTML = labSVG(cur) + '<p>Tap to load a negative</p>'; };

function loadImage(file){
  const url = URL.createObjectURL(file), im = new Image();
  im.onload = () => {
    let w = im.naturalWidth, h = im.naturalHeight;
    const k = Math.min(1, MAXTEX/Math.max(w, h)); w = Math.round(w*k); h = Math.round(h*k);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(im, 0, 0, w, h);   // aplica la orientación EXIF
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, htex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, buildHalo(c));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.activeTexture(gl.TEXTURE0);
    srcC = c; iw = w; ih = h; ready = true; seed = Math.floor(Math.random()*1e6);
    URL.revokeObjectURL(url);
    $('empty').style.display = 'none'; $('empty').innerHTML = '';
    out.style.display = 'block'; $('save').disabled = false;
    setState(); render();
  };
  im.src = url;
}

function save(){
  draw(iw, ih);
  const c = document.createElement('canvas'); c.width = iw; c.height = ih;
  const x = c.getContext('2d'); x.drawImage(glc, 0, 0);
  if(ON.date) stamp(x, iw, ih);
  render();
  const name = `filmstock_${L(cur).replace(/[^a-z0-9]+/gi, '-').toLowerCase()}_${Date.now()}.jpg`;
  c.toBlob(async blob => {
    const f = new File([blob], name, { type:'image/jpeg' });
    if(navigator.canShare && navigator.canShare({ files:[f] })){
      try { await navigator.share({ files:[f] }); return; } catch(e){ if(e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = f.name; a.click();
  }, 'image/jpeg', .95);
}

// ---------- Pestañas ----------
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'p_' + b.dataset.t));
});

// ---------- Parámetros ----------
function syncParams(){
  ['grain','hal','vig','leak'].forEach(k => {
    const r = $('r_' + k), s = LV[k](cur), b = r.querySelector('.sw');
    b.disabled = !s.ok;
    b.setAttribute('aria-pressed', String(s.ok && ON[k]));
    r.classList.toggle('na', !s.ok);
    r.classList.toggle('off', s.ok && !ON[k]);
    r.querySelector('.bar').style.setProperty('--p', (s.ok ? s.p*100 : 0) + '%');
    r.querySelector('b').textContent = s.ok ? String(Math.round(s.p*100)).padStart(3, '0') : 'N/A';
  });
  const r = $('r_date');
  r.querySelector('.sw').setAttribute('aria-pressed', String(ON.date));
  r.classList.toggle('off', !ON.date);
  r.querySelector('b').textContent = ON.date ? 'ON' : 'OFF';
  $('stampv').textContent = dateText();
}
document.querySelectorAll('.sw').forEach(b => b.onclick = () => { const k = b.dataset.k; ON[k] = !ON[k]; syncParams(); req(); });

const sl = $('strength');
function syncStr(){ sl.style.setProperty('--p', sl.value + '%'); $('v_strength').textContent = String(sl.value).padStart(3, '0'); }
sl.addEventListener('input', () => { syncStr(); req(); });
syncStr();

// ---------- Películas ----------
function buildList(){
  const list = $('list'); list.innerHTML = '';
  let g = null, grid = null;
  FILMS.forEach((f, i) => {
    if(f.g !== g){
      g = f.g;
      const h = document.createElement('div'); h.className = 'gh'; h.textContent = g; list.appendChild(h);
      grid = document.createElement('div'); grid.className = 'grid'; list.appendChild(grid);
    }
    const b = document.createElement('button'); b.type = 'button';
    b.innerHTML = `<i>${pad(i+1)}</i><span>${L(f)}</span><u>${TIER[f.t]}</u>`;
    b.onclick = () => pick(i);   // la lista se queda abierta para comparar
    grid.appendChild(b); f._btn = b;
  });
}

let flashT = 0;
function flash(){
  $('fch').textContent = 'C' + pad(ci+1); $('fnm').textContent = L(cur);
  const f = $('flash'); f.classList.add('show');
  clearTimeout(flashT); flashT = setTimeout(() => f.classList.remove('show'), 650);
}

function pick(i, quiet){
  ci = (i + FILMS.length) % FILMS.length; cur = FILMS[ci];
  if(cur.curve) uploadLut(cur);
  FILMS.forEach((f, j) => f._btn && f._btn.classList.toggle('on', j === ci));
  const n = pad(ci+1);
  $('chan').textContent = 'C' + n;
  $('hudfilm').textContent = `CH ${n} · ${L(cur)}`;
  $('filmSub').textContent = `${n} · ${L(cur)}`;
  $('iname').textContent = L(cur);
  $('itier').textContent = `${TIER[cur.t]} ${TSHORT[cur.t]}`;
  $('iiso').textContent = 'ISO ' + cur.iso;
  $('itype').textContent = cur.type;
  $('iproc').textContent = cur.proc.split(' ·')[0];
  $('idesc').textContent = cur.d;
  $('iuses').textContent = cur.uses;
  syncParams(); syncLab(); req();
  if(!quiet) flash();
}
const step = d => pick(ci + d);

$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('filmBtn').onclick = () => { $('sheet').hidden = !$('sheet').hidden; };
$('close').onclick = () => { $('sheet').hidden = true; };
document.addEventListener('keydown', e => {
  if(e.key === 'ArrowRight') step(1);
  else if(e.key === 'ArrowLeft') step(-1);
  else if(e.key === 'Escape') $('sheet').hidden = true;
});

// ---------- Gestos sobre la foto ----------
// Deslizar: cambia de película (cada 48 px, se puede ir y volver sin soltar).
// Mantener quieto: muestra el original. Tocar sin foto: abre el importador.
const stage = $('stage'), SWIPE = 48;
let down = false, px = 0, py = 0, moved = false, holdT = 0;
const hold = v => { if(!ready || holding === v) return; holding = v; setState(); render(); };
stage.addEventListener('pointerdown', e => {
  if(e.button > 0) return;
  down = true; moved = false; px = e.clientX; py = e.clientY;
  try { stage.setPointerCapture(e.pointerId); } catch(_){}
  clearTimeout(holdT);
  holdT = setTimeout(() => { if(down && !moved) hold(true); }, 180);
});
stage.addEventListener('pointermove', e => {
  if(!down) return;
  const dx = e.clientX - px, dy = e.clientY - py;
  if(!moved && Math.hypot(dx, dy) > 10){ moved = true; clearTimeout(holdT); hold(false); }
  if(Math.abs(dx) >= SWIPE && Math.abs(dx) > Math.abs(dy)){
    step(dx < 0 ? 1 : -1);
    px = e.clientX; py = e.clientY;
  }
});
const release = () => { down = false; clearTimeout(holdT); hold(false); };
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => stage.addEventListener(t, release));
stage.addEventListener('click', () => { if(!ready && !moved) $('file').click(); });
stage.addEventListener('contextmenu', e => e.preventDefault());

$('file').addEventListener('change', e => { if(e.target.files[0]) loadImage(e.target.files[0]); e.target.value = ''; });
$('save').onclick = save;

buildList();
pick(0, true);
setState();
</script>
